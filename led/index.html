<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LED scroller simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #0b0f17;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e0e7f0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
            overflow: hidden;
        }
        .app {
            width: 100%;
            max-width: 100%;
            height: 100vh;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 8px 12px;
        }
        .textbox-area textarea {
            width: 100%;
            height: 72px;
            padding: 10px 14px;
            background: #141f2b;
            border: 1px solid #2a3b4c;
            border-radius: 14px;
            color: #d0dce8;
            font-size: 13px;
            resize: vertical;
            font-family: inherit;
            transition: border 0.15s;
        }
        .textbox-area textarea:focus {
            outline: none;
            border-color: #5a7b9a;
            box-shadow: 0 0 0 2px rgba(90, 123, 154, 0.25);
        }
        .textbox-area textarea::placeholder {
            color: #4a5e72;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 2px;
            background: #141f2b;
            border-radius: 16px;
            padding: 6px 10px;
            border: 1px solid #1f2c3a;
            align-items: center;
            flex-shrink: 0;
        }
        .menu-section {
            display: flex;
            align-items: center;
            gap: 3px;
            padding: 0 4px;
            border-right: 1px solid #263544;
        }
        .menu-section:last-child {
            border-right: none;
        }
        .menu-label {
            font-size: 9px;
            color: #5a738a;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-right: 4px;
            font-weight: 600;
        }
        .menu-btn {
            background: transparent;
            border: none;
            color: #8ea4b8;
            padding: 3px 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.1s, color 0.1s;
        }
        .menu-btn:hover {
            background: #1f3040;
            color: #e0edf8;
        }
        .menu-btn:active {
            background: #2a4055;
        }
        .menu-label-display {
            font-size: 11px;
            color: #8ea4b8;
            min-width: 32px;
            text-align: center;
        }
        .menu-range {
            width: 56px;
            accent-color: #6a8aaa;
            background: #1f3040;
            height: 4px;
            border-radius: 4px;
            cursor: pointer;
        }
        .menu-range::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6a8aaa;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(106, 138, 170, 0.4);
        }
        .menu-range::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6a8aaa;
            border: none;
            cursor: pointer;
        }
        .color-picker-wrap {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 2px;
            border: 1px solid #1f3040;
            border-radius: 8px;
            background: #141f2b;
        }
        .color-square {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid #3a4f62;
            flex-shrink: 0;
            background: #ff0040;
            cursor: pointer;
            transition: border 0.15s;
        }
        .color-square:hover {
            border-color: #6a8aaa;
        }
        .color-picker-wrap input[type="color"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
            pointer-events: none;
        }
        .running-wrap {
            flex-shrink: 0;
            height: 80px;
            width: 100%;
            background: #070b10;
            border-radius: 18px;
            border: 1px solid #1f2c3a;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.7);
        }
        .running-viewport {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
        }
        .running-line {
            font-family: 'MK-90', 'Courier New', monospace;
            font-size: 26px;
            color: #ff0040;
            white-space: pre;
            display: inline-block;
            padding: 0 0px 0 4px;
            letter-spacing: 3px;
            word-spacing: 10px;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translate(0px, -50%) translateZ(0);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            text-shadow: 0 0 6px currentColor, 0 0 14px currentColor, 0 0 28px currentColor, 0 0 48px currentColor;
            line-height: 1.2;
            image-rendering: pixelated;
            transition: none;
            contain: paint;
        }
        @font-face {
            font-family: 'MK-90';
            src: url('mk_90.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        @media (max-width: 460px) {
            .app { padding: 4px 6px; max-height: 100vh; height: 100vh; border-radius: 16px; }
            .toolbar { padding: 4px 6px; gap: 2px; }
            .menu-section { padding: 0 2px; }
            .menu-label { font-size: 8px; display: none; }
            .menu-btn { font-size: 12px; padding: 2px 6px; }
            .menu-range { width: 40px; }
            .running-line { font-size: 20px; letter-spacing: 2px; word-spacing: 6px; }
            .running-wrap { height: 64px; }
            .textbox-area textarea { height: 60px; font-size: 12px; }
        }
    </style>
    <link rel="stylesheet" href="../shared/modal.css">
</head>

<body>
    <div class="app">
        <div class="running-wrap">
            <div class="running-viewport" id="viewport">
                <div class="running-line" id="display"></div>
            </div>
        </div>
        
        <!-- TOP TOOLBAR: Font, Speed, Color, Play -->
        <div class="toolbar" id="toolbar-top"></div>

        <div class="textbox-area">
            <textarea id="inputText" placeholder="Paste text with blank lines between messages"></textarea>
        </div>
        
        <!-- BOTTOM TOOLBAR: Prep, Chunk -->
        <div class="toolbar" id="toolbar-bottom"></div>
    </div>

        <script src="../shared/text.js"></script>
    <script src="../shared/prep.js"></script>
<script>
        // -------- STATE --------
        const state = {
            messages: [],
            currentIndex: 0,
            scrollX: 0,
            scrollY: 0,
            color: '#ff0040',
            fontSize: 26,
            speed: 3,
            isPlaying: false,
            isManualAnimating: false,
            viewportWidth: 0,
            viewportHeight: 0,
            lineWidth: 0,
            pauseTimer: null,
            animFrame: null,
            wallPauseTimer: null,
            isAtWall: false,
            isMovingUp: false,
            savedScrollX: 0,
            savedScrollY: 0,
            isHolding: false,
            holdTimer: null,
            textChanged: false,
            freezePause: 600,
            loopCurrent: false,
        };

        // -------- DOM REFS --------
        const input = document.getElementById('inputText');
        const display = document.getElementById('display');
        const viewport = document.getElementById('viewport');

        // -------- HELPERS --------
        function getViewportWidth() {
            return viewport ? viewport.clientWidth : window.innerWidth - 24;
        }
        function getViewportHeight() {
            return viewport ? viewport.clientHeight : 80;
        }
        function getLineWidth(text) {
            if (!text || text === '') return 0;
            const display = document.getElementById('display');
            if (!display) {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.font = state.fontSize + 'px "MK-90", "Courier New", monospace';
                    return ctx.measureText(text).width;
                } catch (e) {
                    return text.length * (state.fontSize * 0.6);
                }
            }
            const originalText = display.textContent;
            const originalTransform = display.style.transform;
            display.textContent = text;
            display.style.transform = 'translate(0px, -50%)';
            const width = display.scrollWidth;
            display.textContent = originalText;
            display.style.transform = originalTransform;
            return width || (text.length * (state.fontSize * 0.6));
        }
        function getDelay(line) {
            const chars = line ? line.length : 0;
            const words = Math.max(chars / 5, 1);
            const msPerWord = 60000 / 400;
            let readingTime = words * msPerWord;
            return Math.max(200, Math.min(800, readingTime * 0.2));
        }
                // -------- LOAD CONTENT --------
        function updateDisplay() {
            const raw = input.value;
            state.messages = splitByBlankLines(raw);
            if (!state.messages.length) state.messages = [''];
            state.currentIndex = 0;
            state.scrollX = 0;
            state.scrollY = 0;
            state.isAtWall = false;
            state.isMovingUp = false;
            state.savedScrollX = 0;
            state.savedScrollY = 0;
            state.textChanged = false;
            if (state.isPlaying) stopPlay();
            render();
        }
        function loadContentFromTextbox() {
            const raw = input.value;
            state.messages = splitByBlankLines(raw);
            if (!state.messages.length) state.messages = [''];
            state.currentIndex = 0;
            state.scrollX = 0;
            state.scrollY = 0;
            state.isAtWall = false;
            state.isMovingUp = false;
            state.savedScrollX = 0;
            state.savedScrollY = 0;
            state.textChanged = false;
            if (state.isPlaying) stopPlay();
            render();
        }

        // -------- RENDER --------

        function renderText() {
            if (!state.messages.length) {
                display.textContent = '';
                return;
            }
            var idx = state.currentIndex;
            if (idx >= state.messages.length) idx = state.messages.length - 1;
            if (idx < 0) idx = 0;
            var currentLine = state.messages[idx] || '';
            if (state.loopCurrent) {
                var gap = state.loopGap || "        ";
                display.textContent = currentLine + gap + currentLine + gap + currentLine;
            } else {
                display.textContent = currentLine;
            }
            display.style.color = state.color;
            display.style.fontSize = state.fontSize + 'px';
            display.style.textShadow = '0 0 6px ' + state.color + ', 0 0 14px ' + state.color + ', 0 0 28px ' + state.color + ', 0 0 48px ' + state.color;
        }

        function renderTransform() {
            var x = state.scrollX || 0;
            var yOffset = state.scrollY || 0;
            if (yOffset === 0) {
                display.style.transform = 'translate(' + x + 'px, -50%)';
            } else {
                display.style.transform = 'translate(' + x + 'px, calc(-50% + ' + yOffset + 'px))';
            }
        }

        function render() {
            if (!state.messages.length) {
                display.textContent = '';
                display.style.transform = 'translate(0px, -50%)';
                return;
            }
            let idx = state.currentIndex;
            if (idx >= state.messages.length) idx = state.messages.length - 1;
            if (idx < 0) idx = 0;
            const currentLine = state.messages[idx] || '';
            if (state.loopCurrent) {
                var gap = state.loopGap || "        ";
                display.textContent = currentLine + gap + currentLine + gap + currentLine;
            } else {
                display.textContent = currentLine;
            }
            display.style.color = state.color;
            display.style.fontSize = state.fontSize + 'px';
            display.style.textShadow = `0 0 6px ${state.color}, 0 0 14px ${state.color}, 0 0 28px ${state.color}, 0 0 48px ${state.color}`;
            const x = state.scrollX || 0;
            const yOffset = state.scrollY || 0;
            display.style.transform = `translate(${x}px, calc(-50% + ${yOffset}px))`;
            const sizeLabel = document.getElementById('sizeLabel');
            if (sizeLabel) sizeLabel.textContent = state.fontSize + 'px';
        }

        // -------- COLOR & FONT --------
        function setColor(color) {
            state.color = color;
            render();
            const sq = document.getElementById('colorSquare');
            if (sq) sq.style.background = color;
        }
        function applyFontSize() {
            const label = document.getElementById('sizeLabel');
            if (label) label.textContent = state.fontSize + 'px';
            render();
        }
        function fontIncrease() {
            state.fontSize = Math.min(state.fontSize + 2, 60);
            applyFontSize();
        }
        function fontDecrease() {
            state.fontSize = Math.max(state.fontSize - 2, 10);
            applyFontSize();
        }

        // -------- STOP ANIMATION --------
        function stopAnimation() {
            if (state.animFrame) {
                cancelAnimationFrame(state.animFrame);
                state.animFrame = null;
            }
            if (state.pauseTimer) {
                clearTimeout(state.pauseTimer);
                state.pauseTimer = null;
            }
            if (state.wallPauseTimer) {
                clearTimeout(state.wallPauseTimer);
                state.wallPauseTimer = null;
            }
            if (state.holdTimer) {
                clearTimeout(state.holdTimer);
                state.holdTimer = null;
            }
            state.isAtWall = false;
            state.isMovingUp = false;
            state.isHolding = false;
            state.isManualAnimating = false;
        }
        function stopHoldScroll() {
            state.isHolding = false;
            clearTimeout(state.holdTimer);
            if (state.animFrame) {
                cancelAnimationFrame(state.animFrame);
                state.animFrame = null;
            }
        }

        // -------- VERTICAL NAVIGATION --------
        function goToNextMessage() {
            if (state.isPlaying) stopPlay();
            if (state.isManualAnimating) return;
            if (!state.messages.length || state.messages[0] === '') {
                loadContentFromTextbox();
                return;
            }
            const nextIndex = (state.currentIndex + 1) % state.messages.length;
            state.isManualAnimating = true;
            state.viewportHeight = getViewportHeight();
            const step = state.speed * 1.5;
            const targetY = -state.viewportHeight;
            function slideUpOut() {
                if (!state.isManualAnimating) {
                    state.scrollY = 0;
                    render();
                    return;
                }
                state.scrollY -= step;
                render();
                if (state.scrollY > targetY) {
                    state.animFrame = requestAnimationFrame(slideUpOut);
                } else {
                    state.currentIndex = nextIndex;
                    state.scrollX = 0;
                    state.scrollY = state.viewportHeight;
                    render();
                    function slideUpIn() {
                        if (!state.isManualAnimating) {
                            state.scrollY = 0;
                            render();
                            return;
                        }
                        state.scrollY -= step;
                        render();
                        if (state.scrollY > 0) {
                            state.animFrame = requestAnimationFrame(slideUpIn);
                        } else {
                            state.scrollY = 0;
                            render();
                            state.isManualAnimating = false;
                        }
                    }
                    slideUpIn();
                }
            }
            slideUpOut();
        }
        function goToPrevMessage() {
            if (state.isPlaying) stopPlay();
            if (state.isManualAnimating) return;
            if (!state.messages.length || state.messages[0] === '') {
                loadContentFromTextbox();
                return;
            }
            const prevIndex = (state.currentIndex - 1 + state.messages.length) % state.messages.length;
            state.isManualAnimating = true;
            state.viewportHeight = getViewportHeight();
            const step = state.speed * 1.5;
            const targetY = state.viewportHeight;
            function slideDownOut() {
                if (!state.isManualAnimating) {
                    state.scrollY = 0;
                    render();
                    return;
                }
                state.scrollY += step;
                render();
                if (state.scrollY < targetY) {
                    state.animFrame = requestAnimationFrame(slideDownOut);
                } else {
                    state.currentIndex = prevIndex;
                    state.scrollX = 0;
                    state.scrollY = -state.viewportHeight;
                    render();
                    function slideDownIn() {
                        if (!state.isManualAnimating) {
                            state.scrollY = 0;
                            render();
                            return;
                        }
                        state.scrollY += step;
                        render();
                        if (state.scrollY < 0) {
                            state.animFrame = requestAnimationFrame(slideDownIn);
                        } else {
                            state.scrollY = 0;
                            render();
                            state.isManualAnimating = false;
                        }
                    }
                    slideDownIn();
                }
            }
            slideDownOut();
        }

        // -------- HORIZONTAL HOLD SCROLL --------
        function startHoldScroll(direction) {
            if (state.isHolding) return;
            if (state.isPlaying) stopPlay();
            stopAnimation();
            state.isManualAnimating = false;
            state.isHolding = true;
            state.viewportWidth = getViewportWidth();
            const line = state.messages[state.currentIndex] || '';
            state.lineWidth = getLineWidth(line);
            const textFits = state.lineWidth <= state.viewportWidth;
            if (textFits) {
                state.isHolding = false;
                return;
            }
            function scrollStep() {
                if (!state.isHolding) return;
                if (direction > 0) {
                    state.scrollX -= state.speed;
                } else {
                    state.scrollX += state.speed;
                }
                render();
                state.viewportWidth = getViewportWidth();
                const line2 = state.messages[state.currentIndex] || '';
                state.lineWidth = getLineWidth(line2);
                const rightEdge = -(state.lineWidth - state.viewportWidth);
                if (direction > 0) {
                    if (state.scrollX <= rightEdge) {
                        state.scrollX = rightEdge;
                        render();
                        state.isHolding = false;
                        return;
                    }
                } else {
                    if (state.scrollX >= 0) {
                        state.scrollX = 0;
                        render();
                        state.isHolding = false;
                        return;
                    }
                }
                state.animFrame = requestAnimationFrame(scrollStep);
            }
            scrollStep();
        }

        // -------- AUTOPLAY --------
        function startPlay() {
            if (state.isPlaying) return;
            if (!state.messages.length || state.messages[0] === '') {
                loadContentFromTextbox();
                if (!state.messages.length) return;
            }
            if (state.savedScrollX !== 0 || state.savedScrollY !== 0) {
                state.scrollX = state.savedScrollX;
                state.scrollY = state.savedScrollY;
                state.savedScrollX = 0;
                state.savedScrollY = 0;
                state.isAtWall = false;
                state.isMovingUp = false;
                render();
                if (state.isAtWall) {
                    state.wallPauseTimer = setTimeout(() => {
                        if (state.isPlaying) {
                            state.isAtWall = false;
                            moveLineUp();
                        }
                    }, state.freezePause);
                } else if (state.isMovingUp) {
                    moveLineUp();
                } else {
                    startScrolling();
                }
                return;
            }
            state.isPlaying = true;
            const btn = document.getElementById('playBtn');
            if (btn) btn.textContent = '⏹';
            state.scrollX = 0;
            state.scrollY = 0;
            state.isAtWall = false;
            state.isMovingUp = false;
            render();
            if (state.loopCurrent) {
                // no initial pause for loop mode
                state.scrollX = 0;
                state.isAtWall = false;
                startScrolling();
                return;
            }
            const delay = getDelay(state.messages[state.currentIndex] || '');
            state.pauseTimer = setTimeout(() => {
                if (state.isPlaying) {
                    state.scrollX = 0;
                    state.isAtWall = false;
                    startScrolling();
                }
            }, Math.max(delay, state.freezePause));
        }
        function stopPlay() {
            state.savedScrollX = state.scrollX;
            state.savedScrollY = state.scrollY;
            state.isPlaying = false;
            state.isManualAnimating = false;
            stopAnimation();
            const btn = document.getElementById('playBtn');
            if (btn) btn.textContent = '▶';
        }
        function togglePlay() {
            if (state.isPlaying) {
                stopPlay();
            } else {
                startPlay();
            }
        }

        // -------- AUTOPLAY: SCROLL HORIZONTAL --------

        function _ledLoopPeriod() {
            var msg = state.messages[state.currentIndex] || '';
            var gap = state.loopGap || "        ";
            var saved = state.loopCurrent;
            state.loopCurrent = false; // measure raw
            var w = getLineWidth(msg + gap);
            state.loopCurrent = saved;
            return w;
        }

        function startScrolling() {
            if (!state.isPlaying) return;

            if (state.loopCurrent) {
                var step = state.speed;
                renderText();                              // once
                state.loopPeriod = _ledLoopPeriod();
                if (state.loopPeriod <= 0) {
                    var holdLoop = function () {
                        if (!state.isPlaying || !state.loopCurrent) return;
                        state.animFrame = requestAnimationFrame(holdLoop);
                    };
                    state.animFrame = requestAnimationFrame(holdLoop);
                    return;
                }
                var period = state.loopPeriod;
                var startTime = performance.now();
                var originX = state.scrollX || 0;
                var animateLoop = function (now) {
                    if (!state.isPlaying || !state.loopCurrent) return;
                    var elapsed = now - startTime;
                    // how far we've traveled since start, in px
                    var traveled = originX - (elapsed * step) / 16.6667;
                    // wrap into (-period, 0]
                    state.scrollX = -(((-traveled) % period + period) % period);
                    renderTransform();
                    state.animFrame = requestAnimationFrame(animateLoop);
                };
                state.animFrame = requestAnimationFrame(animateLoop);
                return;
            }

            // non-loop: original behavior
            state.viewportWidth = getViewportWidth();
            var line = state.messages[state.currentIndex] || '';
            state.lineWidth = getLineWidth(line);
            if (state.lineWidth <= state.viewportWidth) {
                var delay = getDelay(line);
                state.pauseTimer = setTimeout(function () {
                    if (state.isPlaying) moveLineUp();
                }, Math.max(delay, state.freezePause));
                return;
            }
            var targetX = -(state.lineWidth - state.viewportWidth);
            var step2 = state.speed;
            var animateScroll = function () {
                if (!state.isPlaying) return;
                if (state.scrollX > targetX) {
                    state.scrollX -= step2;
                    render();
                    state.animFrame = requestAnimationFrame(animateScroll);
                } else {
                    state.isAtWall = true;
                    state.wallPauseTimer = setTimeout(function () {
                        if (state.isPlaying) {
                            state.isAtWall = false;
                            moveLineUp();
                        }
                    }, state.freezePause);
                }
            };
            animateScroll();
        }

        // -------- AUTOPLAY: MOVE UP --------
        function moveLineUp() {
            if (!state.isPlaying) return;
            state.isMovingUp = true;
            state.viewportHeight = getViewportHeight();
            const targetY = -state.viewportHeight + 20;
            const step = state.speed;
            function animateUp() {
                if (!state.isPlaying) return;
                state.scrollY -= step;
                render();
                if (state.scrollY > targetY) {
                    state.animFrame = requestAnimationFrame(animateUp);
                } else {
                    state.currentIndex = (state.currentIndex + 1) % state.messages.length;
                    state.isMovingUp = false;
                    state.scrollX = 0;
                    state.scrollY = state.viewportHeight - 20;
                    render();
                    const targetY2 = 0;
                    const step2 = state.speed;
                    function slideUp() {
                        if (!state.isPlaying) return;
                        state.scrollY -= step2;
                        render();
                        if (state.scrollY > targetY2) {
                            state.animFrame = requestAnimationFrame(slideUp);
                        } else {
                            state.scrollY = 0;
                            state.scrollX = 0;
                            state.isAtWall = false;
                            render();
                            const delay = getDelay(state.messages[state.currentIndex] || '');
                            state.pauseTimer = setTimeout(() => {
                                if (state.isPlaying) {
                                    state.scrollX = 0;
                                    state.isAtWall = false;
                                    startScrolling();
                                }
                            }, Math.max(delay, state.freezePause));
                        }
                    }
                    slideUp();
                }
            }
            animateUp();
        }

        // -------- FORMATTERS --------
                        function splitPunct(text) {
            const cleaned = text.replace(/[.,!?;:""„”’‘‛‚“`´ʹʺʻʼˈˈˊˋˌ״〃＂〟〝〞‟′″‴‵‶‷❝❞〝〞〟＂｢｣—–]/g, '§');
            return cleaned.split(/§+/).filter(s => s.trim());
        }
                                        // -------- LOW POPUP --------
                // -------- BUILD MENUS --------
        function buildMenus() {
            // Top toolbar: Font, Speed, Color, Play
            const topToolbar = document.getElementById('toolbar-top');
            topToolbar.innerHTML = `
      <div class="menu-section">
        <span class="menu-label">Font</span>
        <button class="menu-btn" id="fontSmall">A−</button>
        <span class="menu-label-display" id="sizeLabel">26px</span>
        <button class="menu-btn" id="fontBig">A+</button>
      </div>
      <div class="menu-section">
        <span class="menu-label">Color</span>
        <div class="color-picker-wrap" id="colorPickerWrap">
          <div class="color-square" id="colorSquare" style="background:#ff0040;"></div>
          <input type="color" id="colorPicker" value="#ff0040"/>
        </div>
      </div>
      <div class="menu-section">
        <span class="menu-label">Play</span>
        <button class="menu-btn" id="playBtn">▶</button>
        <button class="menu-btn" id="slowerBtn">🐢−</button>
        <input type="range" class="menu-range" id="speedSlider" min="1" max="10" step="1" value="3">
        <button class="menu-btn" id="fasterBtn">🐇+</button>
        <span class="menu-label-display" id="speedValue">3</span>
        <label style="color:#8ea4b8;font-size:11px;margin-left:6px;cursor:pointer;">
          <input type="checkbox" id="loopCheck" style="accent-color:#6a8aaa;vertical-align:middle;margin-right:4px;">loop
        </label>
      </div>
    `;

            // Bottom toolbar: Prep, Chunk
            const bottomToolbar = document.getElementById('toolbar-bottom');
            bottomToolbar.innerHTML = `
      <div class="menu-section">
        <span class="menu-label">Prep</span>
        <button class="menu-btn" id="lowBtn">low</button>
        <button class="menu-btn" id="punctBtn">punct</button>
        <button class="menu-btn" id="sentBtn">sent</button>
        <button class="menu-btn" id="loadBtn">↻</button>
      </div>
      <div class="menu-section">
        <span class="menu-label">Chunk words</span>
        <input type="number" id="wordCountInput" value="3" min="1" style="width:44px;padding:2px 6px 2px 8px;background:#1f3040;border:none;border-radius:6px;color:#e0edf8;font-size:12px;text-align:center;">
        <button class="menu-btn" id="applyBtn">apply</button>
      </div>
    `;

            // -------- ATTACH EVENTS --------
            document.getElementById('fontSmall').onclick = fontDecrease;
            document.getElementById('fontBig').onclick = fontIncrease;
            
            const speedSlider = document.getElementById('speedSlider');
            const speedValue = document.getElementById('speedValue');
            document.getElementById('slowerBtn').onclick = function () {
                state.speed = Math.max(state.speed - 1, 1);
                speedSlider.value = state.speed;
                speedValue.textContent = state.speed;
            };
            document.getElementById('fasterBtn').onclick = function () {
                state.speed = Math.min(state.speed + 1, 10);
                speedSlider.value = state.speed;
                speedValue.textContent = state.speed;
            };
            speedSlider.oninput = function (e) {
                state.speed = parseInt(e.target.value);
                speedValue.textContent = state.speed;
            };
            speedValue.textContent = state.speed;

            document.getElementById('playBtn').onclick = togglePlay;
            var loopCheck = document.getElementById('loopCheck');
            if (loopCheck) {
                loopCheck.addEventListener('change', function () {
                    state.loopCurrent = loopCheck.checked;
                    state.loopPeriod = 0;
                    stopPlay();
                    render();
                });
            }

            const sq = document.getElementById('colorSquare');
            const pick = document.getElementById('colorPicker');
            if (sq && pick) {
                sq.addEventListener('click', function () { pick.click(); });
                pick.addEventListener('input', function (e) {
                    setColor(e.target.value);
                });
            }

            document.getElementById('lowBtn').onclick = function () { showLowPopup(input, '\n\n'); };
            document.getElementById('loadBtn').onclick = function () {
                stopPlay();
                updateDisplay();
            };
            document.getElementById('punctBtn').onclick = function () {
                const raw = input.value;
                const blocks = splitPunct(raw);
                if (blocks.length) {
                    input.value = blocks.map(b => b.trim()).join('\n\n');
                    updateDisplay();
                }
            };
            document.getElementById('sentBtn').onclick = function () {
                const raw = input.value;
                const blocks = splitSentences(raw);
                if (blocks.length) {
                    input.value = blocks.map(b => b.trim()).join('\n\n');
                    updateDisplay();
                }
            };
            document.getElementById('applyBtn').onclick = function () { applyChunking(input, '\n\n'); updateDisplay(); };
        }

        // -------- KEYBOARD --------
        document.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
            if (e.key === ' ' || e.key === 'Space' || e.code === 'Space') {
                e.preventDefault();
                if (state.textChanged) updateDisplay();
                togglePlay();
                return;
            }
            if (e.key === 'ArrowDown') { e.preventDefault(); goToNextMessage(); return; }
            if (e.key === 'ArrowUp') { e.preventDefault(); goToPrevMessage(); return; }
            if (e.key === 'ArrowRight') {
                e.preventDefault();
                if (state.textChanged) updateDisplay();
                startHoldScroll(1);
                return;
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                if (state.textChanged) updateDisplay();
                startHoldScroll(-1);
                return;
            }
            if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                stopPlay();
                updateDisplay();
                return;
            }
            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                input.focus();
                input.select();
            }
        });
        document.addEventListener('keyup', function (e) {
            if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                e.preventDefault();
                stopHoldScroll();
            }
        });

        // -------- TOUCH --------
        let touchStartX = 0, touchStartY = 0, isSwiping = false;
        document.addEventListener('touchstart', function (e) {
            if (e.target.closest('.toolbar') || e.target.closest('textarea') ||
                e.target.closest('input') || e.target.closest('button')) return;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isSwiping = false;
            if (state.isPlaying) stopPlay();
        }, { passive: true });
        document.addEventListener('touchmove', function (e) {
            if (e.target.closest('.toolbar') || e.target.closest('textarea') ||
                e.target.closest('input') || e.target.closest('button')) return;
            if (isSwiping) return;
            const dx = e.touches[0].clientX - touchStartX;
            const dy = e.touches[0].clientY - touchStartY;
            if (Math.abs(dx) > 20 || Math.abs(dy) > 20) {
                isSwiping = true;
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) startHoldScroll(-1);
                    else startHoldScroll(1);
                } else {
                    if (dy > 0) goToNextMessage();
                    else goToPrevMessage();
                }
            }
        }, { passive: true });
        document.addEventListener('touchend', function (e) {
            if (e.target.closest('.toolbar') || e.target.closest('textarea') ||
                e.target.closest('input') || e.target.closest('button')) return;
            stopHoldScroll();
        }, { passive: true });

        // -------- INPUT CHANGE --------
        input.addEventListener('input', function () {
            const raw = input.value;
            state.messages = splitByBlankLines(raw);
            if (!state.messages.length) state.messages = [''];
            state.currentIndex = 0;
            state.scrollX = 0;
            state.scrollY = 0;
            state.isAtWall = false;
            state.isMovingUp = false;
            state.savedScrollX = 0;
            state.savedScrollY = 0;
            state.textChanged = false;
            if (state.isPlaying) stopPlay();
        });

        // -------- INIT --------
        buildMenus();
        input.value = '';
        const pick = document.getElementById('colorPicker');
        if (pick) setColor(pick.value);
    </script>
    <script src="../shared/bridge.js"></script>
</body>
