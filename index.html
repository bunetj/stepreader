<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>stepreader</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #0f0f0f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #e8e8e8;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
}
.screen { display: none; height: 100vh; width: 100vw; }
.screen.active { display: flex; flex-direction: column; }

/* HUB */
#hub { padding: 32px 16px; gap: 16px; align-items: center; }
.hub-title {
    font-size: 24px;
    font-weight: 600;
    color: #e8e8e8;
    letter-spacing: 0.5px;
}
.hub-new {
    background: #2a2a2a;
    border: 1px solid #333333;
    color: #f0f0f0;
    padding: 10px 22px;
    border-radius: 12px;
    font-size: 14px;
    cursor: pointer;
}
.hub-new:hover { background: #3a3a3a; }
.hub-list {
    width: 100%;
    max-width: 520px;
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 12px;
}
.hub-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    line-height: 1.2;
    box-sizing: border-box;
}
.hub-item:hover { background: #1a2634; }
.hub-item-name {
    font-size: 14px;
    color: #d8d8d8;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    margin-right: 10px;
}
.hub-item-del {
    background: transparent;
    border: none;
    color: #6a6a6a;
    font-size: 16px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
}
.hub-item-del:hover { color: #ff5566; background: #2a2a2a; }
.hub-item-new {
    display: flex;
    align-items: center;
    background: #1a1a1a;
    border: 1px dashed #333333;
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    color: #9a9a9a;
    font-size: 14px;
    line-height: 1.2;
    box-sizing: border-box;
}
.hub-item-new:hover { background: #1a2634; color: #f0f0f0; border-color: #444444; }
.hub-empty { color: #555555; font-size: 13px; text-align: center; margin-top: 20px; }

/* CHAT */
#chat { padding: 8px 12px; gap: 8px; }
.chat-bar {
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 14px;
    padding: 8px 12px;
    flex-shrink: 0;
}
.chat-bar-row1 { display: flex; align-items: center; gap: 10px; }
.chat-back {
    background: transparent;
    border: none;
    color: #9a9a9a;
    font-size: 18px;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 8px;
}
.chat-back:hover { background: #2a2a2a; color: #f0f0f0; }
.chat-name {
    flex: 1;
    font-size: 14px;
    color: #d8d8d8;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.chat-name:hover { background: #2a2a2a; }
.chat-name-input {
    flex: 1;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 6px;
    color: #f0f0f0;
    font-size: 14px;
    padding: 4px 8px;
    outline: none;
}
.chat-save {
    background: #3a3a3a;
    border: 1px solid #444444;
    color: #f0f0f0;
    padding: 6px 14px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
}
.chat-save:hover { background: #444444; }
.chat-save:disabled { opacity: 0.4; cursor: default; }
.chat-bar-row2 {
    display: flex;
    gap: 4px;
    align-items: center;
    justify-content: space-between;
}
.chat-modes { display: flex; gap: 4px; }
.chat-mode {
    background: transparent;
    border: 1px solid #333333;
    color: #9a9a9a;
    padding: 4px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
}
.chat-mode:hover { background: #2a2a2a; color: #f0f0f0; }
.chat-mode.active { background: #3a3a3a; color: #f0f0f0; border-color: #444444; }
.chat-frame-wrap {
    flex: 1;
    min-height: 0;
    border-radius: 0;
    overflow: hidden;
    border: none;
    background: transparent;
}
.chat-frame-wrap iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: transparent;
    outline: none;
}

.chat-toggle-chunks {
    background: transparent;
    border: 1px solid #333333;
    color: #9a9a9a;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
}
.chat-toggle-chunks:hover { background: #2a2a2a; color: #f0f0f0; }
.chat-toggle-chunks.active { background: #3a3a3a; color: #f0f0f0; border-color: #444444; }
.chat-chunks-controls { display: flex; gap: 4px; }

/* Split modal */
.split-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}
.split-modal.open { display: flex; }
.split-box {
    background: #242424;
    border: 1px solid #333333;
    border-radius: 16px;
    padding: 20px;
    width: 90%;
    max-width: 560px;
    color: #e8edf2;
}
.split-box h3 {
    margin: 0 0 6px 0;
    font-size: 18px;
    font-weight: 600;
    color: #e8edf2;
}
.split-box .sub {
    font-size: 12px;
    color: #666666;
    margin-bottom: 14px;
}
.split-box .sub code {
    background: #1a1a1a;
    padding: 2px 6px;
    border-radius: 4px;
    color: #9a9a9a;
    font-size: 12px;
}
.split-box textarea {
    width: 100%;
    height: 240px;
    padding: 10px 14px;
    background: #1a1a1a;
    border: 1px solid #333333;
    border-radius: 10px;
    color: #e8edf2;
    font-size: 13px;
    resize: vertical;
    font-family: inherit;
    outline: none;
}
.split-box .btn-row {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 14px;
}
.split-box .btn-row button {
    padding: 8px 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
}
.split-box .btn-cancel { background: #333333; color: #8e9aa5; }
.split-box .btn-save { background: #3a3a3a; color: #e8edf2; }

.chunks-panel {
    display: none;
    flex-direction: column;
    gap: 6px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 6px 10px;
    flex-shrink: 0;
}
.chunks-panel.open { display: flex; }
.chunks-row {
    display: flex;
    align-items: center;
    gap: 6px;
}
.chunks-row-items {
    overflow-x: auto;
    min-height: 32px;
}
.chunks-row-actions {
    min-height: 32px;
    padding-top: 4px;
    border-top: 1px solid #2a2a2a;
}
.chunks-tab {
    background: transparent;
    border: 1px solid #333333;
    color: #9a9a9a;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
}
.chunks-tab:hover { background: #2a2a2a; color: #f0f0f0; }
.chunks-tab.active { background: #3a3a3a; color: #f0f0f0; border-color: #444444; }
.chunks-add {
    background: transparent;
    border: 1px dashed #333333;
    color: #6a6a6a;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
}
.chunks-add:hover { color: #f0f0f0; border-color: #444444; }
.chunks-add.active {
    background: #3a3a3a;
    border-color: #444444;
    border-style: solid;
    color: #f0f0f0;
}
.chunks-empty {
    color: #555555;
    font-size: 12px;
    padding: 2px 6px;
}
.chunk {
    display: inline-flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    background: transparent;
    border: 1px solid #333333;
    color: #9a9a9a;
    padding: 4px 6px 4px 10px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    user-select: none;
    min-width: 90px;
}
.chunk:hover { background: #2a2a2a; color: #f0f0f0; }
.chunk.active { background: #3a3a3a; color: #f0f0f0; border-color: #444444; }
.chunk.dragging { opacity: 0.4; }
.chunk-name { pointer-events: auto; flex: 1; }
.chunk-name-input {
    background: #2a2a2a;
    border: 1px solid #444444;
    border-radius: 4px;
    color: #f0f0f0;
    font-size: 12px;
    padding: 2px 6px;
    outline: none;
    width: 80px;
}
.chunk-del {
    background: transparent;
    border: none;
    color: #6a6a6a;
    font-size: 11px;
    cursor: pointer;
    padding: 0 2px;
    border-radius: 4px;
    line-height: 1;
}
.chunk-del:hover { color: #ff5566; background: #2a2a2a; }
</style>
</head>
<body>

<div class="screen active" id="hub">
    <div class="hub-title">stepreader</div>
    <div class="hub-list" id="hubList"></div>
</div>

<div class="screen" id="chat">
    <div class="chat-bar">
        <div class="chat-bar-row1">
            <button class="chat-back" id="chatBack">&larr;</button>
            <div class="chat-name" id="chatName">Untitled</div>
            <button class="chat-save" id="chatSave">Save</button>
        </div>
        <div class="chat-bar-row2">
            <div class="chat-modes">
                <button class="chat-mode" data-mode="led">led</button>
                <button class="chat-mode" data-mode="subtitles">subtitles</button>
                <button class="chat-mode" data-mode="telegram">telegram</button>
            </div>
            <button class="chat-toggle-chunks" id="chatToggleChunks">&#9776; Pieces</button>

        </div>
    </div>
    <div class="chunks-panel" id="chunksPanel">
        <div class="chunks-row chunks-row-items" id="chunksRowItems"></div>
        <div class="chunks-row chunks-row-actions">
            <button class="chunks-add" id="chunksAdd">+ Piece</button>
            <button class="chunks-add" id="chatSplitBtn">Split</button>
            <button class="chunks-add" id="chunksBatchBtn">Batch</button>
        </div>
    </div>
    <div class="chat-frame-wrap" id="frameWrap"></div>
</div>

<div class="split-modal" id="splitModal">
    <div class="split-box">
        <h3>Split into pieces</h3>
        <div class="sub">Paste text. Delimiter: <code>&lt;&lt;&lt;SPLIT&gt;&gt;&gt;</code></div>
        <textarea id="splitText" placeholder="Paste your long text here..."></textarea>
        <div class="btn-row">
            <button class="btn-cancel" id="splitCancel">Cancel</button>
            <button class="btn-save" id="splitApply">Split</button>
        </div>
    </div>
</div>

<script src="shared/text.js"></script>
<script>
// ---- STORE ----
const Store = {
    cache: [],
    current: null,

    async list() {
        const r = await fetch('/api/chats');
        this.cache = await r.json();
        return this.cache;
    },
    async create(obj) {
        const r = await fetch('/api/chats', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(obj)
        });
        const c = await r.json();
        this.cache.push(c);
        return c;
    },
    async update(id, patch) {
        const r = await fetch('/api/chats/' + id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(patch)
        });
        return await r.json();
    },
    async remove(id) {
        await fetch('/api/chats/' + id, {method: 'DELETE'});
        this.cache = this.cache.filter(c => c.id !== id);
    }
};

// ---- ROUTER ----
const Router = {
    show(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    },
    showHub() {
        if (window._frame) {
            window._frame.remove();
            window._frame = null;
        }
        Store.current = null;
        document.title = 'stepreader';
        history.replaceState(null, '', location.pathname);
        this.show('hub');
        Hub.refresh();
    },
    openChat(chat) {
        Store.current = chat;
        if (chat && chat.id) {
            history.replaceState(null, '', '#chat=' + chat.id);
        } else {
            history.replaceState(null, '', '#chat=new');
        }
        this.show('chat');
        Chat.render();
    },

    openById(id) {
        const chat = Store.cache.find(c => c.id === id);
        if (chat) {
            Router.openChat(chat);
        } else {
            // не нашли в кэше — грузим список и пробуем ещё раз
            Store.list().then(() => {
                const c2 = Store.cache.find(c => c.id === id);
                if (c2) Router.openChat(c2);
                else Router.showHub();
            });
        }
    }
};

// ---- HUB ----
const Hub = {
    async refresh() {
        const list = await Store.list();
        const box = document.getElementById('hubList');
        box.innerHTML = '';

        // new chat row (always first)
        const newRow = document.createElement('div');
        newRow.className = 'hub-item-new';
        newRow.textContent = '+ New chat';
        newRow.onclick = () => Router.openChat(Chat.newDraft());
        box.appendChild(newRow);

        if (!list.length) {
            const e = document.createElement('div');
            e.className = 'hub-empty';
            e.textContent = 'Nothing yet';
            box.appendChild(e);
            return;
        }
        list.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        for (const chat of list) {
            const row = document.createElement('div');
            row.className = 'hub-item';
            const name = document.createElement('div');
            name.className = 'hub-item-name';
            name.textContent = chat.name || 'Untitled';
            const del = document.createElement('button');
            del.className = 'hub-item-del';
            del.textContent = '🗑';
            del.onclick = async (e) => {
                e.stopPropagation();
                if (!confirm('Delete "' + (chat.name || 'Untitled') + '"?')) return;
                await Store.remove(chat.id);
                Hub.refresh();
            };
            row.appendChild(name);
            row.appendChild(del);
            row.onclick = () => Router.openChat(chat);
            box.appendChild(row);
        }
    }
};

// ---- MODE CONVERT ----
const ModeConvert = {
    // telegram -> not-telegram: '---' -> '\n\n'
    toNonTelegram(text) {
        if (!text) return text;
        // '---' на отдельной строке -> пустая строка
        return text.replace(/\n\s*---\s*\n/g, '\n\n');
    }
};

// ---- BATCH ----
const Batch = {
    _pending: {},
    _reqCounter: 0,

    run(op, args) {
        const c = Store.current;
        if (!c || !c.batch) return;
        const chunks = c.chunks || [];
        if (!chunks.length) return;
        const frame = window._frame;
        if (!frame || !Chat._ready) return;

        const activeIdx = (typeof c.currentChunk === 'number') ? c.currentChunk : 0;

        for (let i = 0; i < chunks.length; i++) {
            if (i === activeIdx) continue;
            const text = chunks[i].text || '';
            if (!text.trim()) continue;
            const reqId = 'r' + (Batch._reqCounter++);
            Batch._pending[reqId] = i;
            frame.contentWindow.postMessage({
                type: 'batch-apply',
                reqId: reqId,
                op: op,
                args: args,
                text: text
            }, '*');
        }
    },

    onResult(reqId, newText) {
        const idx = Batch._pending[reqId];
        if (idx == null) return;
        delete Batch._pending[reqId];
        const c = Store.current;
        if (!c || !c.chunks || !c.chunks[idx]) return;
        c.chunks[idx].text = newText;
        Chunks.render();
        Chat.saveState();
    }
};

// ---- CHUNKS ----
const Chunks = {
    render() {
        const c = Store.current;
        const row = document.getElementById('chunksRowItems');
        if (!c || !row) return;
        const addBtn = document.getElementById('chunksAdd');
        row.innerHTML = '';
        const chunks = c.chunks || [];
        if (!chunks.length) {
            const e = document.createElement('span');
            e.className = 'chunks-empty';
            e.textContent = 'No pieces yet';
            row.appendChild(e);
        } else {
            chunks.forEach((ch, idx) => {
                row.appendChild(Chunks.makeTab(ch, idx));
            });
        }
        addBtn.onclick = () => Chunks.add();

        // восстановить состояние Batch
        const bBtn = document.getElementById('chunksBatchBtn');
        if (bBtn) bBtn.classList.toggle('active', !!c.batch);

        // скролл к активному куску
        const active = row.querySelector('.chunk.active');
        if (active) {
            active.scrollIntoView({block: 'nearest', inline: 'nearest'});
        }

        // авто-переименование
        if (Chunks._autoRenameIdx != null) {
            const idx = Chunks._autoRenameIdx;
            Chunks._autoRenameIdx = null;
            const tab = row.querySelector('.chunk[data-idx="' + idx + '"] .chunk-name');
            if (tab) {
                setTimeout(() => Chunks.rename(idx, tab), 0);
            }
        }
    },

    makeTab(ch, idx) {
        const tab = document.createElement('div');
        tab.className = 'chunk';
        if (idx === (Store.current.currentChunk || 0)) tab.classList.add('active');
        tab.draggable = true;
        tab.dataset.idx = idx;

        const name = document.createElement('span');
        name.className = 'chunk-name';
        name.textContent = ch.name || ('Piece ' + (idx + 1));

        const del = document.createElement('button');
        del.className = 'chunk-del';
        del.textContent = '✕';
        del.onclick = (e) => {
            e.stopPropagation();
            Chunks.remove(idx);
        };

        tab.appendChild(name);
        tab.appendChild(del);

        let clickTimer = null;
        tab.onclick = (e) => {
            if (clickTimer) return;
            clickTimer = setTimeout(() => {
                clickTimer = null;
                Chunks.select(idx);
            }, 220);
        };
        tab.ondblclick = (e) => {
            e.stopPropagation();
            if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
            Chunks.rename(idx, name);
        };

        // drag-n-drop
        tab.ondragstart = (e) => {
            tab.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(idx));
        };
        tab.ondragend = () => {
            tab.classList.remove('dragging');
        };
        tab.ondragover = (e) => {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        };
        tab.ondrop = (e) => {
            e.preventDefault();
            const from = parseInt(e.dataTransfer.getData('text/plain'));
            const to = idx;
            if (isNaN(from) || from === to) return;
            Chunks.move(from, to);
        };

        return tab;
    },

    add() {
        const c = Store.current;
        if (!c) return;
        if (!c.chunks) c.chunks = [];
        // если кусков не было — текущий текст становится первым куском
        if (c.chunks.length === 0 && c.text) {
            c.chunks.push({id: Chunks.newId(), name: 'Piece 1', text: c.text});
        }
        // номер имени — следующий свободный (не заполняем дыры)
        let maxN = 0;
        (c.chunks || []).forEach(ch => {
            const m = (ch.name || '').match(/^Piece (\d+)$/);
            if (m) {
                const k = parseInt(m[1]);
                if (k > maxN) maxN = k;
            }
        });
        const newName = 'Piece ' + (maxN + 1);
        // позиция вставки — после активного
        const activeIdx = (typeof c.currentChunk === 'number') ? c.currentChunk : -1;
        const insertAt = (activeIdx >= 0 && activeIdx < c.chunks.length) ? activeIdx + 1 : c.chunks.length;
        c.chunks.splice(insertAt, 0, {id: Chunks.newId(), name: newName, text: ''});
        c.currentChunk = insertAt;
        const p = document.getElementById('chunksPanel');
        const b = document.getElementById('chatToggleChunks');
        if (p) p.classList.toggle('open', !!c.chunksOpen);
        if (b) b.classList.toggle('active', !!c.chunksOpen);
        Chunks._autoRenameIdx = insertAt;
        Chunks.render();
        Chat.pushChunkToFrame();
        Chat.saveState();
    },

    select(idx) {
        const c = Store.current;
        if (!c || !c.chunks) return;
        c.currentChunk = idx;
        Chunks.render();
        Chat.pushChunkToFrame();
        Chat.saveState();
    },

    remove(idx) {
        const c = Store.current;
        if (!c || !c.chunks) return;
        if (!confirm('Delete "' + (c.chunks[idx].name || 'Piece') + '"?')) return;
        c.chunks.splice(idx, 1);
        if (c.currentChunk >= c.chunks.length) c.currentChunk = Math.max(0, c.chunks.length - 1);
        Chunks.render();
        Chat.pushChunkToFrame();
        Chat.saveState();
    },

    rename(idx, span) {
        const c = Store.current;
        if (!c || !c.chunks) return;
        if (!span) {
            span = document.querySelector('.chunk[data-idx="' + idx + '"] .chunk-name');
        }
        if (!span) return;
        const old = c.chunks[idx].name || ('Piece ' + (idx + 1));
        const input = document.createElement('input');
        input.className = 'chunk-name-input';
        input.value = old;
        span.replaceWith(input);
        input.focus();
        input.select();

        let done = false;
        const finish = (ok) => {
            if (done) return;
            done = true;
            const name = ok ? (input.value.trim() || ('Piece ' + (idx + 1))) : old;
            c.chunks[idx].name = name;
            Chunks.render();
            Chat.saveState();
        };
        input.onblur = () => finish(true);
        input.onkeydown = (e) => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
            if (e.key === 'Escape') { e.preventDefault(); finish(false); }
        };
    },

    move(from, to) {
        const c = Store.current;
        if (!c || !c.chunks) return;
        const item = c.chunks.splice(from, 1)[0];
        c.chunks.splice(to, 0, item);
        if (c.currentChunk === from) c.currentChunk = to;
        else if (from < c.currentChunk && to >= c.currentChunk) c.currentChunk--;
        else if (from > c.currentChunk && to <= c.currentChunk) c.currentChunk++;
        Chunks.render();
        Chat.saveState();
    },

    newId() {
        return 'ch_' + Math.random().toString(36).slice(2, 10);
    }
};

// ---- CHAT ----
const Chat = {
    _ready: false,
    _pending: null,

    render() {
        const c = Store.current;
        if (!c) return;
        document.getElementById('chatName').textContent = c.name || 'Untitled';
        document.title = (c.name || 'Untitled') + ' — stepreader';
        document.getElementById('chatSave').disabled = !!c.id;
        document.querySelectorAll('.chat-mode').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === c.mode);
        });
        // если есть куски — панель открыта
        if (c.chunks && c.chunks.length > 0) c.chunksOpen = true;
        const p = document.getElementById('chunksPanel');
        const b = document.getElementById('chatToggleChunks');
        if (p) p.classList.toggle('open', !!c.chunksOpen);
        if (b) b.classList.toggle('active', !!c.chunksOpen);
        Chunks.render();
        this.mountFrame();
    },

    saveChunksOpen() {
        const c = Store.current;
        if (!c || !c.id) return;
        Store.update(c.id, {chunksOpen: !!c.chunksOpen});
    },

    pushChunkToFrame() {
        const c = Store.current;
        const frame = window._frame;
        if (!c || !frame || !this._ready) return;
        const chunks = c.chunks || [];
        if (!chunks.length) return;
        const idx = c.currentChunk || 0;
        const ch = chunks[idx];
        if (!ch) return;
        frame.contentWindow.postMessage({
            type: 'init',
            text: ch.text || '',
            settings: (c.settings && c.settings[c.mode]) || {}
        }, '*');
    },

    saveState() {
        const c = Store.current;
        if (!c || !c.id) return;
        Store.update(c.id, {
            chunks: c.chunks || [],
            currentChunk: c.currentChunk || 0,
            chunksOpen: !!c.chunksOpen,
            batch: !!c.batch
        });
    },

    mountFrame() {
        const c = Store.current;
        const wrap = document.getElementById('frameWrap');
        wrap.innerHTML = '';
        const iframe = document.createElement('iframe');
        iframe.src = c.mode + '/index.html';
        wrap.appendChild(iframe);
        window._frame = iframe;
        this._ready = false;
        const chunks = c.chunks || [];
        let initText = c.text || '';
        if (chunks.length) {
            const idx = c.currentChunk || 0;
            if (chunks[idx]) initText = chunks[idx].text || '';
        }
        this._pending = {text: initText, settings: (c.settings && c.settings[c.mode]) || {}};

        const self = this;
        window.addEventListener('message', function onMsg(e) {
            if (e.source !== iframe.contentWindow) return;
            const msg = e.data;
            if (!msg) return;
            if (msg.type === 'batch-result') {
                Batch.onResult(msg.reqId, msg.text);
                return;
            }
            if (msg.type === 'prep') {
                if (msg.op) {
                    Batch.run(msg.op, msg.args || {});
                }
                return;
            }
            if (msg.type === 'ready') {
                self._ready = true;
                if (self._pending) {
                    iframe.contentWindow.postMessage({
                        type: 'init',
                        text: self._pending.text,
                        settings: self._pending.settings
                    }, '*');
                    self._pending = null;
                }
            }
            if (msg.type === 'change') {
                const c = Store.current;
                if (!c) return;
                if (!c.settings) c.settings = {};
                c.settings[c.mode] = msg.settings;
                const chunks = c.chunks || [];
                if (chunks.length) {
                    const idx = c.currentChunk || 0;
                    if (chunks[idx]) chunks[idx].text = msg.text;
                    if (c.id) Store.update(c.id, {chunks: c.chunks, settings: c.settings});
                } else {
                    c.text = msg.text;
                    if (c.id) Store.update(c.id, {text: c.text, settings: c.settings});
                }
            }
        });
    },

    newDraft() {
        return {
            name: 'Untitled',
            mode: 'telegram',
            text: '',
            settings: {},
            chunks: [],
            currentChunk: 0,
            chunksOpen: false,
            batch: false
        };
    },

    autoName(text) {
        const c = Store.current;
        let source = text || '';
        if (c && c.chunks && c.chunks.length) {
            const first = c.chunks[0];
            if (first && first.text) source = first.text;
        }
        const words = source.trim().split(/\s+/).filter(Boolean).slice(0, 4);
        return words.join(' ') || 'Untitled';
    },

    async save() {
        const c = Store.current;
        if (!c || c.id) return;
        // попросить у iframe свежий state
        const frame = window._frame;
        if (frame && this._ready) {
            frame.contentWindow.postMessage({type: 'save'}, '*');
        }
        // если есть куски — имя берём из первого непустого
        if (!c.name || c.name === 'Untitled') {
            let nameSource = c.text || '';
            const chunks = c.chunks || [];
            for (let i = 0; i < chunks.length; i++) {
                if (chunks[i].text && chunks[i].text.trim()) {
                    nameSource = chunks[i].text;
                    break;
                }
            }
            c.name = this.autoName(nameSource);
        }
        const saved = await Store.create({
            name: c.name,
            mode: c.mode,
            text: c.text,
            settings: c.settings,
            chunks: c.chunks || [],
            currentChunk: c.currentChunk || 0,
            chunksOpen: !!c.chunksOpen,
            batch: !!c.batch
        });
        Store.current = saved;
        this.render();
    },

    bind() {
        document.getElementById('chatBack').onclick = () => Router.showHub();
        document.getElementById('chatSave').onclick = () => Chat.save();

        document.getElementById('chunksBatchBtn').onclick = () => {
            const c = Store.current;
            if (!c) return;
            c.batch = !c.batch;
            const b = document.getElementById('chunksBatchBtn');
            if (b) b.classList.toggle('active', !!c.batch);
            Chat.saveState();
        };

        document.getElementById('chatSplitBtn').onclick = () => {
            const m = document.getElementById('splitModal');
            const ta = document.getElementById('splitText');
            if (ta) ta.value = '';
            if (m) m.classList.add('open');
            if (ta) setTimeout(() => ta.focus(), 50);
        };
        document.getElementById('splitCancel').onclick = () => {
            document.getElementById('splitModal').classList.remove('open');
        };
        document.getElementById('splitModal').onclick = (e) => {
            if (e.target.id === 'splitModal') {
                e.currentTarget.classList.remove('open');
            }
        };
        document.getElementById('splitText').addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('splitApply').click();
            }
        });

        document.getElementById('splitApply').onclick = () => {
            const ta = document.getElementById('splitText');
            const raw = ta ? ta.value : '';
            const parts = raw.split('<<<SPLIT>>>')
                .map(s => s.trim())
                .filter(s => s);
            if (!parts.length) {
                document.getElementById('splitModal').classList.remove('open');
                return;
            }
            const c = Store.current;
            if (!c) return;
            if (!c.chunks) c.chunks = [];
            const startN = c.chunks.length;
            parts.forEach((text, i) => {
                c.chunks.push({
                    id: Chunks.newId(),
                    name: 'Piece ' + (startN + i + 1),
                    text: text
                });
            });
            // активным становится первый новый кусок
            c.currentChunk = startN;
            // открыть панель кусков, чтобы было видно
            c.chunksOpen = true;
            const p = document.getElementById('chunksPanel');
            const b = document.getElementById('chatToggleChunks');
            if (p) p.classList.add('open');
            if (b) b.classList.add('active');
            Chunks.render();
            Chat.pushChunkToFrame();
            Chat.saveState();
            if (ta) ta.value = '';
            document.getElementById('splitModal').classList.remove('open');
        };

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const m = document.getElementById('splitModal');
                if (m && m.classList.contains('open')) {
                    m.classList.remove('open');
                }
            }
        });

        document.getElementById('chatToggleChunks').onclick = () => {
            const c = Store.current;
            if (!c) return;
            c.chunksOpen = !c.chunksOpen;
            const p = document.getElementById('chunksPanel');
            const b = document.getElementById('chatToggleChunks');
            p.classList.toggle('open', !!c.chunksOpen);
            b.classList.toggle('active', !!c.chunksOpen);
            Chat.saveChunksOpen();
        };


        document.getElementById('chatName').onclick = () => {
            const c = Store.current;
            if (!c) return;
            const el = document.getElementById('chatName');
            const input = document.createElement('input');
            input.className = 'chat-name-input';
            input.value = c.name || '';
            el.replaceWith(input);
            input.focus();
            input.select();
            const finish = async (ok) => {
                const newName = ok ? (input.value.trim() || 'Untitled') : (c.name || 'Untitled');
                c.name = newName;
                const div = document.createElement('div');
                div.className = 'chat-name';
                div.id = 'chatName';
                div.textContent = newName;
                input.replaceWith(div);
                Chat.bind();
                if (c.id) await Store.update(c.id, {name: newName});
            };
            input.onblur = () => finish(true);
            input.onkeydown = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                if (e.key === 'Escape') { e.preventDefault(); finish(false); }
            };
        };

        document.querySelectorAll('.chat-mode').forEach(btn => {
            btn.onclick = async () => {
                const c = Store.current;
                if (!c) return;
                if (c.mode === btn.dataset.mode) return;
                // сохранить текущее состояние перед сменой
                if (window._frame && Chat._ready) {
                    window._frame.contentWindow.postMessage({type: 'save'}, '*');
                }
                // если уходим из telegram — конвертируем разделители
                if (c.mode === 'telegram' && btn.dataset.mode !== 'telegram') {
                    if (c.chunks && c.chunks.length) {
                        c.chunks.forEach(ch => {
                            ch.text = ModeConvert.toNonTelegram(ch.text || '');
                        });
                    }
                    c.text = ModeConvert.toNonTelegram(c.text || '');
                }
                c.mode = btn.dataset.mode;
                Chat.render();
                if (c.id) await Store.update(c.id, {
                    mode: c.mode,
                    chunks: c.chunks || [],
                    text: c.text || ''
                });
            };
        });
    }
};

Chat.bind();


// старт: проверить hash
(function boot() {
    const m = location.hash.match(/^#chat=(.+)$/);
    if (m && m[1] && m[1] !== 'new') {
        Router.openById(m[1]);
    } else {
        Router.showHub();
    }
})();

// реакция на кнопку "назад" в браузере
window.addEventListener('hashchange', () => {
    const m = location.hash.match(/^#chat=(.+)$/);
    if (m && m[1] && m[1] !== 'new') {
        if (!Store.current || Store.current.id !== m[1]) {
            Router.openById(m[1]);
        }
    } else {
        if (Store.current) Router.showHub();
    }
});
</script>
