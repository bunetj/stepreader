<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f5f5f5;padding:16px}
.app{max-width:640px;margin:0 auto}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tabs button{flex:1;padding:10px;border:1px solid #ccc;background:#fff;border-radius:6px;cursor:pointer;font-size:14px;min-width:60px}
.tabs button.active{background:#000;color:#fff;border-color:#000}
iframe{width:100%;height:600px;border:1px solid #ddd;border-radius:6px;background:#fff}
</style>
</head>
<body>
<div class="app">
<div class="tabs">
<button class="active" data-src="subtitle.html">🎬 Subtitle</button>
<button data-src="chat.html">💬 Chat</button>
<button data-src="chunks.html">📄 Chunks</button>
</div>
<iframe id="viewer"></iframe>
</div>

<script>
const iframe = document.getElementById('viewer');
const buttons = document.querySelectorAll('.tabs button');

function loadApp(src) {
 iframe.src = src;
}

buttons.forEach(btn => {
 btn.addEventListener('click', function() {
  buttons.forEach(b => b.classList.remove('active'));
  this.classList.add('active');
  loadApp(this.dataset.src);
 });
});

loadApp('subtitle.html');
</script>
</body>
</html>
