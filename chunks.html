<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chunks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;min-height:100vh}
.app{max-width:520px;width:100%}
textarea{width:100%;padding:10px;border:1px solid #444;border-radius:6px;background:#2a2a2a;color:#ddd;font-size:14px;min-height:60px;resize:vertical}
.row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;align-items:center}
.row button,.row input{padding:6px 12px;border:1px solid #444;border-radius:4px;background:#2a2a2a;color:#ddd;cursor:pointer;font-size:13px}
.row button:hover{background:#3a3a3a}
.row input{width:50px;cursor:text}
.chunks{background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:20px 16px;min-height:200px;max-height:50vh;overflow-y:auto;font-size:18px;line-height:1.8;color:#ddd;white-space:pre-wrap}
.chunks .hidden{visibility:hidden}
.chunks .revealed{visibility:visible}



</style>
</head>
<body>
<div class="app">
<textarea id="inputText" placeholder="Paste text here"></textarea>
<div class="row">
<button id="fontSmall">A−</button>
<button id="fontBig">A+</button>
<span id="sizeLabel">18px</span>
<button id="lowBtn">low</button>
<button id="sentBtn">sentences</button>
<label>words: <input type="number" id="wordCount" value="6" min="1" style="width:60px;"/></label>
<button id="applyBtn">apply</button>
</div>
<div class="chunks" id="display"></div>
</div>

<script>
// ===== ШРИФТ =====
let fontSize = 18;
const displayEl = document.getElementById('display');

function applyFontSize() {
  if (displayEl) displayEl.style.fontSize = fontSize + 'px';
  document.getElementById('sizeLabel').textContent = fontSize + 'px';
}

document.getElementById('fontSmall').onclick = () => {
  fontSize = Math.max(fontSize - 2, 10);
  applyFontSize();
};
document.getElementById('fontBig').onclick = () => {
  fontSize = Math.min(fontSize + 2, 40);
  applyFontSize();
};

// ===== ФОРМАТТЕРЫ (СОХРАНЯЮТ ВСЁ) =====
function toLower(t) { return t.toLowerCase(); }

function splitSentences(t) {
  const result = [];
  let start = 0;
  for (let i = 0; i < t.length; i++) {
    if (t[i] === '.' || t[i] === '!' || t[i] === '?') {
      const next = t[i + 1] || '';
      if (next === ' ' || next === '\n' || next === '\t' || !next) {
        result.push(t.slice(start, i + 1).trim());
        start = i + 1;
      }
    }
  }
  if (start < t.length) result.push(t.slice(start).trim());
  return result.length ? result : [t];
}

function splitWords(t, n) {
  // Разбиваем на части по n слов, сохраняя все пробелы и переносы
  const parts = [];
  let wordCount = 0;
  let start = 0;
  let inWord = false;

  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (ch === ' ' || ch === '\n' || ch === '\t') {
      if (inWord) {
        wordCount++;
        inWord = false;
      }
    } else {
      if (!inWord) {
        inWord = true;
        if (wordCount > 0 && wordCount % n === 0) {
          parts.push(t.slice(start, i));
          start = i;
        }
      }
    }
  }
  if (inWord) wordCount++;
  parts.push(t.slice(start));
  return parts.filter(p => p.trim().length > 0);
}

function escapeHtml(t) {
  return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ===== ПРИЛОЖЕНИЕ =====
const input = document.getElementById('inputText');
const display = document.getElementById('display');
const lowBtn = document.getElementById('lowBtn');
const sentBtn = document.getElementById('sentBtn');
const applyBtn = document.getElementById('applyBtn');
const wordCount = document.getElementById('wordCount');

let items = [];
let idx = 0;
let hasContent = false;
let lastText = input.value;

function render() {
  if (!items.length || !hasContent) {
    display.textContent = '';
    return;
  }
  if (idx >= items.length) idx = items.length - 1;
  if (idx < 0) idx = 0;

  let html = '';
  for (let i = 0; i < items.length; i++) {
    const cls = i <= idx ? 'revealed' : 'hidden';
    html += `<span class="${cls}">${escapeHtml(items[i])}</span>`;
  }
  display.innerHTML = html;

  if (idx > 0) {
    const revealed = display.querySelectorAll('.revealed');
    if (revealed.length) {
      const last = revealed[revealed.length - 1];
      last.scrollIntoView({ block: 'end', behavior: 'smooth' });
    }
  }
  applyFontSize();
}

function loadFromTextbox(mode) {
  const raw = input.value;
  const n = parseInt(wordCount.value) || 6;

  if (mode === 'sentences') {
    items = splitSentences(raw);
  } else {
    items = splitWords(raw, n);
  }
  hasContent = items.length > 0;
  idx = 0;
  render();
}

lowBtn.onclick = () => {
  input.value = toLower(input.value);
  lastText = input.value;
  loadFromTextbox('words');
};

sentBtn.onclick = () => {
  loadFromTextbox('sentences');
};

applyBtn.onclick = () => {
  loadFromTextbox('words');
};

// ===== СЛЕДИМ ЗА ИЗМЕНЕНИЕМ ТЕКСТБОКСА =====
input.addEventListener('input', function() {
  if (this.value !== lastText) {
    lastText = this.value;
    hasContent = false;
    items = [];
    display.textContent = '';
  }
});

// ===== КЛАВИАТУРА =====
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA') return;

  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (!hasContent) {
      loadFromTextbox('words');
      return;
    }
    if (idx > 0) { idx--; render(); }
    return;
  }
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    if (!hasContent) {
      loadFromTextbox('words');
      return;
    }
    if (idx < items.length - 1) { idx++; render(); }
    return;
  }

  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (!hasContent) {
      loadFromTextbox('words');
      return;
    }
    if (e.shiftKey) {
      if (idx > 0) { idx--; render(); }
    } else {
      if (idx < items.length - 1) { idx++; render(); }
    }
  }
});

applyFontSize();
</script>
</body>
</html>
